[tool.poetry]
name = "decision-trees"
version = "0.2.0"
description = "A Personal Decision Intelligence System for modeling, tracking, and optimizing your daily decision-making processes."
authors = ["Tom Rochette <tom@tomrochette.com>"]
license = "MIT"
readme = "README.md"
keywords = ["decision-making", "routines", "habits", "productivity", "introspection"]

[tool.poetry.dependencies]
python = "^3.8"
pyyaml = "^6.0"

[tool.poetry.dev-dependencies]
black = "^22.3.0"
isort = "^5.10.1"
pytest = "^7.1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
